<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClickerMain</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Отключаем синий фон при нажатии и выделение текста */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            outline: none;
        }

        body {
            margin: 0; padding: 0;
            background-color: #17212b; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .header { width: 100%; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .stats { font-size: 18px; margin-bottom: 10px; opacity: 0.8; }

        /* Кнопка кликера */
        .clicker-btn {
            width: 200px; height: 200px; border-radius: 50%;
            background: linear-gradient(135deg, #2b5278, #1c3c5a);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center;
            font-size: 64px; cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 30px;
        }

        /* Эффект при нажатии (кнопка вдавливается) */
        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Магазин */
        .shop { width: 90%; background: #242f3d; border-radius: 15px; padding: 15px; overflow-y: auto; max-height: 35vh; }
        .shop-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; text-align: center; }
        
        .upgrade-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; background: #1c2733; border-radius: 10px; margin-bottom: 8px;
        }
        .upgrade-info { font-size: 14px; }
        
        /* Кнопки в магазине */
        .upgrade-btn {
            background: #2b5278; color: white; border: none; padding: 8px 15px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* Отключаем синий фон */
            transition: background 0.2s, transform 0.1s;
        }
        
        .upgrade-btn:active:not(:disabled) {
            background: #3a6b9e;
            transform: scale(0.95);
        }

        .upgrade-btn:disabled { background: #2f3b4a; opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">🖱 ClickerMain</div>
    <div class="stats" id="coinsDisplay">💰 Монет: 0</div>
    <div class="stats" id="powerDisplay">⚡ Сила: 1</div>

    <div class="clicker-btn" id="clickBtn">🖱</div>

    <div class="shop">
        <div class="shop-title">🛒 Магазин улучшений</div>
        <div id="shopList"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.enableClosingConfirmation();

        let state = {
            coins: 0,
            power: 1,
            upgrades: [
                { id: 0, name: "Новичок", cost: 15, power: 1 },
                { id: 1, name: "Любитель", cost: 50, power: 3 },
                { id: 2, name: "Профи", cost: 150, power: 8 },
                { id: 3, name: "Мастер", cost: 500, power: 20 },
                { id: 4, name: "Легенда", cost: 1500, power: 50 }
            ],
            bought: []
        };

        function loadData() {
            try {
                let initData = tg.initDataUnsafe;
                if (initData && initData.start_param) {
                    let parsed = JSON.parse(decodeURIComponent(initData.start_param));
                    if (parsed.coins !== undefined) state.coins = parsed.coins;
                    if (parsed.power !== undefined) state.power = parsed.power;
                    if (parsed.bought !== undefined) state.bought = parsed.bought;
                }
            } catch(e) { console.log("Ошибка загрузки данных", e); }
            updateUI();
        }

        function updateUI() {
            document.getElementById('coinsDisplay').innerText = `💰 Монет: ${state.coins}`;
            document.getElementById('powerDisplay').innerText = `⚡ Сила: ${state.power}`;
            
            let shop = document.getElementById('shopList');
            shop.innerHTML = '';
            state.upgrades.forEach((up, idx) => {
                let isBought = state.bought.includes(idx);
                let canAfford = state.coins >= up.cost;
                
                let div = document.createElement('div');
                div.className = 'upgrade-item';
                div.innerHTML = `
                    <div class="upgrade-info">
                        <b>${up.name}</b><br>
                        +${up.power} силы | ${up.cost} 💰
                    </div>
                    <button class="upgrade-btn" ${isBought ? 'disabled' : (canAfford ? '' : 'disabled')} 
                            onclick="buyUpgrade(${idx})">
                        ${isBought ? 'Куплено' : 'Купить'}
                    </button>
                `;
                shop.appendChild(div);
            });
        }

        document.getElementById('clickBtn').addEventListener('click', () => {
            state.coins += state.power;
            tg.HapticFeedback.impactOccurred('medium');
            updateUI();
        });

        window.buyUpgrade = function(idx) {
            let up = state.upgrades[idx];
            if (!state.bought.includes(idx) && state.coins >= up.cost) {
                state.coins -= up.cost;
                state.power += up.power;
                state.bought.push(idx);
                tg.HapticFeedback.notificationOccurred('success');
                updateUI();
            }
        };

        tg.onEvent('themeChanged', updateUI);
        tg.MainButton.setText("Сохранить и выйти");
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            tg.sendData(JSON.stringify(state));
            tg.close();
        });

        loadData();
    </script>
</body>
</html>
